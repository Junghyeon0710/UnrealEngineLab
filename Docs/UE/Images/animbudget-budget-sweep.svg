<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif">
  <rect x="0" y="0" width="760" height="430" fill="#fcfcfb" stroke="#e0e0dc" stroke-width="1" rx="6"/>

  <text x="46" y="30" font-size="15" font-weight="600" fill="#22262b">BudgetMs를 낮춰도 비용이 내려가지 않는 구간</text>
  <text x="46" y="48" font-size="12" fill="#6a7078">스켈레탈 메시 400개, 스탠드얼론. 세로축은 BudgetedAnimation 게임스레드 시간</text>

  <g stroke="#e6e6e2" stroke-width="1">
    <line x1="90" y1="360" x2="710" y2="360"/>
    <line x1="90" y1="302" x2="710" y2="302"/>
    <line x1="90" y1="244" x2="710" y2="244"/>
    <line x1="90" y1="186" x2="710" y2="186"/>
    <line x1="90" y1="128" x2="710" y2="128"/>
    <line x1="90" y1="70" x2="710" y2="70"/>
  </g>

  <line x1="90" y1="70" x2="90" y2="360" stroke="#9aa0a6" stroke-width="1.2"/>
  <line x1="90" y1="360" x2="710" y2="360" stroke="#9aa0a6" stroke-width="1.2"/>

  <g font-size="11" fill="#6a7078" text-anchor="end">
    <text x="80" y="364">0</text>
    <text x="80" y="306">1</text>
    <text x="80" y="248">2</text>
    <text x="80" y="190">3</text>
    <text x="80" y="132">4</text>
    <text x="80" y="74">5</text>
  </g>
  <text x="30" y="215" font-size="11" fill="#6a7078" transform="rotate(-90 30 215)" text-anchor="middle">애니메이션 시간 (ms)</text>

  <g font-size="11" fill="#6a7078" text-anchor="middle">
    <text x="90" y="380">0.25</text>
    <text x="233" y="380">0.5</text>
    <text x="377" y="380">1.0</text>
    <text x="520" y="380">2.0</text>
    <text x="710" y="380">5.0</text>
  </g>
  <text x="400" y="402" font-size="11" fill="#6a7078" text-anchor="middle">a.Budget.BudgetMs 설정값</text>

  <!-- 설정값과 실제 비용이 같아지는 기준선 -->
  <line x1="90" y1="345.5" x2="710" y2="70" stroke="#b9bec4" stroke-width="1.4" stroke-dasharray="5 4"/>
  <g>
    <rect x="529" y="86" width="176" height="18" fill="#fcfcfb" rx="3"/>
    <text x="617" y="99" font-size="11" fill="#8d9298" text-anchor="middle">설정값과 같아지는 기준선</text>
  </g>

  <!-- MaxTickRate 10 (기본값) -->
  <polyline points="90.0,186.6 233.0,190.6 377.0,191.2 520.0,190.6 710.0,107.7"
            fill="none" stroke="#2f6f9f" stroke-width="2.4"/>
  <g fill="#2f6f9f">
    <circle cx="90" cy="186.6" r="4.5"/>
    <circle cx="233" cy="190.6" r="4.5"/>
    <circle cx="377" cy="191.2" r="4.5"/>
    <circle cx="520" cy="190.6" r="4.5"/>
    <circle cx="710" cy="107.7" r="4.5"/>
  </g>
  <text x="200" y="176" font-size="11.5" fill="#2f6f9f" font-weight="600">예산을 8배 조여도 2.9 ms 에서 평평하다</text>

  <!-- MaxTickRate 60 으로 완화 -->
  <polyline points="90.0,301.4 377.0,280.5" fill="none" stroke="#c8752a" stroke-width="2.4"/>
  <g fill="#c8752a">
    <circle cx="90" cy="301.4" r="4.5"/>
    <circle cx="377" cy="280.5" r="4.5"/>
  </g>
  <text x="104" y="322" font-size="11.5" fill="#c8752a" font-weight="600">상한을 풀면 기준선을 따라 내려온다</text>

  <text x="98" y="64" font-size="11" fill="#8a5a5a">예산 미적용 기준값은 13.68 ms 로 축 범위 밖이다</text>

  <g font-size="11.5">
    <rect x="428" y="298" width="272" height="52" fill="#ffffff" stroke="#e0e0dc" rx="4"/>
    <line x1="442" y1="315" x2="468" y2="315" stroke="#2f6f9f" stroke-width="2.4"/>
    <circle cx="455" cy="315" r="4" fill="#2f6f9f"/>
    <text x="476" y="319" fill="#3c4147">MaxTickRate 10 (기본값)</text>
    <line x1="442" y1="337" x2="468" y2="337" stroke="#c8752a" stroke-width="2.4"/>
    <circle cx="455" cy="337" r="4" fill="#c8752a"/>
    <text x="476" y="341" fill="#3c4147">MaxTickRate 60 으로 완화</text>
  </g>
</svg>
