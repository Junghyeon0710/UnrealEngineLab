[/Script/Terminal.TerminalSettings]
; 기본값인 CascadiaMono에는 한글 글리프가 없어서 전부 네모로 나온다. 엔진 터미널은
; Windows에서 Fonts 폴더의 .ttf만 찾으므로 gulim.ttc 같은 모음집은 쓸 수 없고,
; 한글이 들어 있는 고정폭 .ttf는 새굴림(NGULIM.TTF)뿐이다.
;
; 이걸 바꿔도 폭 문제까지 풀리지는 않는다. 엔진 터미널은 전각 문자를 1칸으로 세는데
; CLI는 2칸으로 계산하므로, 한글이 화면에 있는 동안 TUI 테두리가 어긋난다.
; Editor Preferences > Terminal 에서 되돌릴 수 있다.
FontFamily=NGULIM

; 터미널이 최근 5초 안에 출력했으면 에디터를 닫을 때 확인 대화상자가 뜬다.
; 터미널 출력을 잃지 않게 막아 주는 기본 동작인데, 이 프로젝트에서는 AI Widget
; Inspector 패널이 CLI 터미널을 늘 띄워 두므로 사실상 닫을 때마다 걸린다.
; UE에서 C++을 고치면 에디터를 닫아야 빌드가 되고, 그게 하루에 여러 번이다.
;
; 대화 자체는 잃지 않는다. 패널은 대화 id를 Saved에 적어 두고 다시 켤 때
; 이어받는다. 되돌리려면 이 줄을 지우거나 True로 바꾸면 된다.
bPreventCloseDuringActivity=False
